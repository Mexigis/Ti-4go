name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias (lockfile congelado)
        run: bun install --frozen-lockfile

      - name: Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Suite forense
        run: bun test tests/

      - name: Build de producción
        run: |
          bunx prisma db push --skip-generate
          bun run build
        env:
          DATABASE_URL: "file:./db/ci.db"
